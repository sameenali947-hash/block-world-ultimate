<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOCK WORLD: ULTIMATE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#78d5ff;color:white}
#game{position:fixed;inset:0}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(#164477aa,#101c42dd)}
.panel{background:#182b50ed;padding:30px;border:2px solid #ffffff55;border-radius:25px;width:min(850px,94vw);text-align:center;box-shadow:0 20px 60px #10204499}
h1{font-size:clamp(32px,6vw,58px);margin:5px;color:#ffdf55;text-shadow:0 5px #a65c25}
p{color:#d5e7ff}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:25px}
button{border:0;border-radius:15px;padding:15px 8px;color:white;font-weight:bold;font-size:15px;cursor:pointer;background:linear-gradient(#579bff,#3154a7);box-shadow:0 5px #203c79}
button:hover{filter:brightness(1.2);transform:translateY(-2px)}
.mode{min-height:115px;font-size:17px}
.mode span{display:block;font-size:35px;margin-bottom:8px}
#hud{position:fixed;top:15px;left:15px;right:15px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:3}
.stat{background:#172b50dd;border:1px solid #ffffff55;padding:12px 15px;border-radius:12px;font-weight:bold}
#objective{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#172b50dd;padding:12px 18px;border-radius:12px;z-index:3;text-align:center}
#menuButton{margin-left:auto;background:#ed5d70}
#message{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);background:#172b50;padding:18px 25px;border-radius:15px;display:none;z-index:8;font-weight:bold;text-align:center}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:none;justify-content:space-between;z-index:4}
.control{font-size:25px;padding:18px;background:#172b50cc;touch-action:none}
#help{position:fixed;bottom:15px;right:15px;background:#172b50cc;padding:10px;border-radius:10px;z-index:3}
@media(max-width:650px){.modes{grid-template-columns:repeat(2,1fr)}.mode:last-child{grid-column:span 2}#help{display:none}.control{padding:16px}#controls{display:flex}}
</style>
</head>
<body>
<div id="game"></div>

<div id="menu">
 <div class="panel">
  <h1>BLOCK WORLD</h1>
  <h2>ULTIMATE 🌎</h2>
  <p>Explore • Build • Survive • Become a legend!</p>
  <div class="modes">
   <button class="mode" onclick="start('obby')"><span>🏃</span>OBBY</button>
   <button class="mode" onclick="start('simulator')"><span>🪙</span>SIMULATOR</button>
   <button class="mode" onclick="start('survival')"><span>🛡️</span>SURVIVAL</button>
   <button class="mode" onclick="start('tycoon')"><span>🏗️</span>TYCOON</button>
   <button class="mode" onclick="start('roleplay')"><span>🏡</span>ROLEPLAY</button>
  </div>
  <p>WASD to move • SPACE to jump • E to interact</p>
 </div>
</div>

<div id="hud">
 <div class="stat" id="mode">🌎 WORLD</div>
 <div class="stat" id="health">❤️ 100</div>
 <div class="stat" id="coins">🪙 0</div>
 <div class="stat" id="level">⭐ Level 1</div>
 <button id="menuButton" onclick="goMenu()">☰ MENU</button>
</div>
<div id="objective"></div>
<div id="message"></div>
<div id="help">WASD Move | SPACE Jump | E Interact</div>
<div id="controls">
 <div>
  <button class="control" data-key="a">◀</button>
  <button class="control" data-key="d">▶</button>
 </div>
 <div>
  <button class="control" onclick="jump()">⬆ JUMP</button>
  <button class="control" onclick="interact()">E</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82d7ff);
scene.fog=new THREE.Fog(0x82d7ff,35,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x668855,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,35,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const grass=material(0x53bd62);
const dirt=material(0x87552e);
const blue=material(0x3479ee);
const skin=material(0xffc18b);
const dark=material(0x26334a);
const gold=material(0xffd02e);
const purple=material(0x9859e9);
const red=material(0xf05b68);
const green=material(0x27a86a);
const white=material(0xffffff);

let player,mode='obby',playing=false;
let keys={},touch={},objects=[],coins=0,health=100,level=1;
let speed=5,vy=0,onGround=false,buildings=0,frame=0;
let clock=new THREE.Clock();

function cube(x,y,z,w,h,d,mat,group=scene){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 group.add(mesh);
 return mesh;
}

function clearWorld(){
 for(const o of objects)scene.remove(o);
 objects=[];
}

function addObject(o){
 scene.add(o);
 objects.push(o);
 return o;
}

function makePlayer(){
 const g=new THREE.Group();
 cube(0,1.1,0,.8,.9,.5,blue,g);
 cube(0,1.85,0,.62,.62,.62,skin,g);
 cube(-.14,1.9,.32,.07,.08,.03,dark,g);
 cube(.14,1.9,.32,.07,.08,.03,dark,g);
 const legs=[];
 legs.push(cube(-.22,.4,0,.3,.7,.35,dark,g));
 legs.push(cube(.22,.4,0,.3,.7,.35,dark,g));
 g.userData.legs=legs;
 addObject(g);
 return g;
}

function platform(x,y,z,w,d,mat=grass){
 const p=cube(x,y,z,w,.6,d,mat);
 p.userData.platform=true;
 return p;
}

function makeCoin(x,z){
 const g=new THREE.Group();
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(.4,.4,.13,16),
  gold
 );
 m.rotation.x=Math.PI/2;
 g.add(m);
 const glow=new THREE.PointLight(0xffcf33,1,3);
 g.add(glow);
 g.position.set(x,1.2,z);
 g.userData={coin:true};
 addObject(g);
}

function tree(x,z){
 cube(x,1,z,.5,2,.5,dirt);
 cube(x,2.5,z,2,2,2,green);
}

function npc(x,z,mat=purple){
 const g=new THREE.Group();
 cube(0,1,0,.7,.9,.5,mat,g);
 cube(0,1.75,0,.6,.6,.6,skin,g);
 g.position.set(x,0,z);
 g.userData.npc=true;
 addObject(g);
}

function buildWorld(){
 platform(0,-.4,0,50,50);
 cube(0,-1.2,0,50,1.2,50,dirt);

 for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2;
  tree(Math.cos(a)*21,Math.sin(a)*21);
 }
}

function start(selected){
 mode=selected;
 coins=0;
 health=100;
 level=1;
 speed=5;
 buildings=0;
 frame=0;
 vy=0;

 clearWorld();
 buildWorld();

 player=makePlayer();
 player.position.set(0,0,5);

 if(mode==='obby'){
  for(let i=0;i<9;i++){
   const x=(i%2===0)?-2:2;
   const z=-2-i*4;
   platform(x,1+i*.3,z,3.5,3);
   makeCoin(x,z);
  }
  platform(0,4,-40,8,8,gold);
  cube(0,6,-40,2,4,.4,purple);
 }else if(mode==='simulator'){
  for(let i=0;i<25;i++){
   makeCoin((Math.random()-.5)*35,(Math.random()-.5)*35);
  }
  platform(0,.1,-8,5,4,gold);
 }else if(mode==='survival'){
  for(let i=0;i<18;i++){
   makeCoin((Math.random()-.5)*35,(Math.random()-.5)*35);
  }
  for(let i=0;i<5;i++){
   npc((Math.random()-.5)*25,(Math.random()-.5)*25,purple);
  }
 }else if(mode==='tycoon'){
  platform(0,.1,-10,13,12,dirt);
  platform(0,.3,-16,4,3,gold);
  for(let i=0;i<12;i++){
   makeCoin((Math.random()-.5)*30,(Math.random()-.5)*30);
  }
 }else if(mode==='roleplay'){
  for(let i=0;i<12;i++){
   const x=(i%4-1.5)*9;
   const z=-10-Math.floor(i/4)*10;
   const h=3+(i%3)*2;
   cube(x,h/2,z,5,h,5,[blue,red,purple,green][i%4]);
  }
  npc(-5,-5,purple);
  npc(5,-12,red);
  npc(0,7,green);
  for(let i=0;i<12;i++){
   makeCoin((Math.random()-.5)*30,(Math.random()-.5)*30);
  }
 }

 document.getElementById('menu').style.display='none';
 document.getElementById('hud').style.display='flex';
 document.getElementById('objective').style.display='block';
 document.getElementById('mode').textContent=selected.toUpperCase();
 const goals={
  obby:'Reach the finish platform!',
  simulator:'Collect coins and upgrade your speed!',
  survival:'Avoid danger and collect coins!',
  tycoon:'Collect 15 coins and press E to build!',
  roleplay:'Explore the city and meet people!'
 };
 document.getElementById('objective').textContent=goals[selected];
 playing=true;
 updateHUD();
}

function updateHUD(){
 document.getElementById('health').textContent='❤️ '+health;
 document.getElementById('coins').textContent='🪙 '+coins;
 document.getElementById('level').textContent='⭐ Level '+level;
}

function say(text){
 const m=document.getElementById('message');
 m.textContent=text;
 m.style.display='block';
 setTimeout(()=>m.style.display='none',1800);
}

function jump(){
 if(playing&&onGround){
  vy=9;
  onGround=false;
 }
}

function interact(){
 if(!playing)return;
 if(mode==='simulator'){
  if(coins>=10){
   coins-=10;
   speed+=1;
   say('⚡ SPEED UPGRADED!');
  }else say('You need 10 coins!');
 }
 if(mode==='tycoon'){
  if(coins>=15){
   coins-=15;
   buildings++;
   const x=-4+(buildings%3)*4;
   const z=-10-Math.floor((buildings-1)/3)*4;
   cube(x,2,z,3,4,3,[blue,red,purple,green][buildings%4]);
   say('🏠 NEW BUILDING!');
  }else say('You need 15 coins!');
 }
 if(mode==='roleplay')say('👋 Welcome to Block City!');
}

window.jump=jump;
window.interact=interact;
window.start=start;
window.goMenu=()=>{
 playing=false;
 document.getElementById('menu').style.display='flex';
 document.getElementById('hud').style.display='none';
 document.getElementById('objective').style.display='none';
};

window.restart=()=>start(mode);

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space'){e.preventDefault();jump()}
 if(e.key.toLowerCase()==='e')interact();
 if(e.key==='Escape')goMenu();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>
  b.addEventListener(ev,()=>touch[k]=false)
 );
});

function update(dt){
 frame++;
 const left=keys.a||keys.arrowleft||touch.a;
 const right=keys.d||keys.arrowright||touch.d;
 const forward=keys.w||keys.arrowup;
 const back=keys.s||keys.arrowdown;

 let dx=(right?1:0)-(left?1:0);
 let dz=(back?1:0)-(forward?1:0);
 const len=Math.hypot(dx,dz)||1;
 dx/=len;dz/=len;

 player.position.x+=dx*speed*dt;
 player.position.z+=dz*speed*dt;

 player.position.x=THREE.MathUtils.clamp(player.position.x,-23,23);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-23,23);

 if(mode==='obby'){
  player.position.x=THREE.MathUtils.clamp(player.position.x,-8,8);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-44,10);
 }

 vy-=24*dt;
 player.position.y+=vy*dt;
 onGround=false;

 let floor=0;
 for(const o of objects){
  if(o.userData.platform){
   const top=o.position.y+.3;
   const w=o.geometry.parameters.width/2;
   const d=o.geometry.parameters.depth/2;
   if(Math.abs(player.position.x-o.position.x)<w+.25 &&
      Math.abs(player.position.z-o.position.z)<d+.25 &&
      player.position.y<=top+.15 &&
      player.position.y>=top-.8 && vy<=0){
     floor=Math.max(floor,top);
   }
  }
 }

 if(player.position.y<=floor){
  player.position.y=floor;
  vy=0;
  onGround=true;
 }

 if(player.position.y < -10){
  health-=25;
  player.position.set(0,0,5);
  vy=0;
  say('Careful! You fell!');
  if(health<=0){
   health=0;
   gameOver();
  }
 }

 if(Math.abs(dx)+Math.abs(dz)>.1){
  player.rotation.y=Math.atan2(dx,dz);
  const swing=Math.sin(frame*.22)*.5;
  player.userData.legs[0].rotation.x=swing;
  player.userData.legs[1].rotation.x=-swing;
 }else{
  player.userData.legs.forEach(l=>l.rotation.x=0);
 }

 for(const o of [...objects]){
  if(o.userData.coin){
   o.rotation.y+=dt*2;
   o.position.y=1.2+Math.sin(frame*.07)*.15;
   if(o.position.distanceTo(player.position)<1.4){
    scene.remove(o);
    objects.splice(objects.indexOf(o),1);
    coins++;
    if(coins%10===0){
     level++;
     say('⭐ LEVEL UP!');
    }
   }
  }
 }

 if(mode==='survival'&&frame%180===0){
  health-=5;
  if(health<=0)gameOver();
 }

 if(mode==='obby'&&player.position.z < -35 && player.position.y>2.5){
  coins+=50;
  say('🏆 OBBY COMPLETE! +50 COINS');
  playing=false;
 }

 if(mode==='tycoon'&&buildings>0&&frame%300===0){
  coins+=buildings*2;
  say('💵 Your buildings earned coins!');
 }

 if(frame%600===0&&mode==='simulator'){
  coins+=3;
  say('🪙 BONUS +3 COINS');
 }

 updateHUD();
}

function gameOver(){
 playing=false;
 say('GAME OVER! Return to the menu to try again.');
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(playing){
  update(dt);
  const desired=new THREE.Vector3(
   player.position.x,
   player.position.y+7,
   player.position.z+11
  );
  camera.position.lerp(desired,.12);
  camera.lookAt(
   player.position.x,
   player.position.y+2,
   player.position.z
  );
 }

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

buildWorld();
camera.position.set(0,8,15);
camera.lookAt(0,0,0);
animate();
</script>
</body>
</html>
